name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install Requirements
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Build Dist
      run: ./build-dist.py

    # The freedesktop.org configuration is what the production instance actually
    # ships: it uses a different base URL and hash-based routing, so it needs its
    # own build to be exercised.
    - name: Build Dist (freedesktop.org configuration)
      run: ./build-dist.py --config fdo
